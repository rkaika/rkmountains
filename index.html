<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RK Mountains</title>
  <style>
    :root {
      --bg: #f6f8f5;
      --ink: #172016;
      --muted: #60705d;
      --line: #d7ddd2;
      --card: #ffffff;
      --blue: #216da8;
      --green: #277a38;
      --shadow: 0 16px 36px rgba(23, 32, 22, 0.08);
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(180deg, rgba(246, 248, 245, 0.96), rgba(255, 255, 255, 0.98)),
        radial-gradient(circle at 12% 8%, rgba(33, 109, 168, 0.14), transparent 30%),
        radial-gradient(circle at 86% 12%, rgba(39, 122, 56, 0.12), transparent 28%);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      border-bottom: 2px solid var(--ink);
      margin-bottom: 24px;
      padding-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-style: italic;
      font-weight: 400;
      line-height: 0.96;
    }

    .subhead {
      margin-top: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    a.card {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    a.card:hover,
    a.card:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 20px 44px rgba(23, 32, 22, 0.12);
      outline: none;
      transform: translateY(-2px);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .path {
      margin-top: 22px;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>RK Mountains</h1>
      <div class="subhead">Weather tools</div>
    </header>

    <section class="links" aria-label="Pages">
      <a class="card" href="summit_weather.html">
        <span>
          <h2>Summit Weather</h2>
          <p>Cascade Range summit forecast dashboard with model comparison, verdicts, and NWS discussion.</p>
        </span>
        <span class="path">summit_weather.html</span>
      </a>

      <a class="card" href="mountain-weather-window.html">
        <span>
          <h2>Climb Weather Window</h2>
          <p>PNW climb planning view for comparing timing, route conditions, and weather windows.</p>
        </span>
        <span class="path">mountain-weather-window.html</span>
      </a>
    </section>
  </main>
</body>
</html>
